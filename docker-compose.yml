services:
  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: alphaedge-core
    environment:
      MODE: backtest
      STRATEGY: MomentumStrategy1
    command:
      [
        "--mode",
        "${MODE:-backtest}",
        "--strategy",
        "${STRATEGY:-MomentumStrategy1}",
      ]
    volumes:
      - alphaedge_results:/app/results
      # 回測要讀 `data/db/tw_stock.db`。映像裡沒有資料庫，不掛就會在
      # `sqlite3.connect` 當場失敗——compose 承諾的「Trader＋Frontend」
      # 一次都跑不起來。**唯讀掛載**：容器只跑回測，
      # 不該寫到本機的資料庫（背景 ETL 可能正在寫同一個檔）
      - ./data:/app/data:ro
      - ./logs:/app/logs

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: alphaedge-frontend
    ports:
      - "8501:8501"
    environment:
      # 與後端 `core/config/paths.py` 同名；後端寫哪、前端就讀哪
      ALPHAEDGE_RESULTS_DIR: /results
    volumes:
      - alphaedge_results:/results
    depends_on:
      - core

volumes:
  alphaedge_results:
