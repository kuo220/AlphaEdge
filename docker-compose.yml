services:
  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: alphaedge-core
    environment:
      MODE: backtest
      STRATEGY: MomentumStrategy1
    command:
      [
        "--mode",
        "${MODE:-backtest}",
        "--strategy",
        "${STRATEGY:-MomentumStrategy1}",
      ]
    volumes:
      - alphaedge_results:/app/results

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: alphaedge-frontend
    ports:
      - "8501:8501"
    environment:
      ALPHAEDGE_BACKTEST_RESULTS: /results
    volumes:
      - alphaedge_results:/results
    depends_on:
      - core

volumes:
  alphaedge_results:
