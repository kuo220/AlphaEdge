[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaedge"
version = "0.1.0"
description = "台股量化研究平台：資料 ETL、回測引擎與策略開發"
requires-python = ">=3.12"

# 只列「程式碼實際 import 的套件」，不照抄 requirements.txt。
# 清單由 AST 掃描 core/、tasks/、frontend/、tests/、strategy_lab/ 的 import 產出，
# 版本下限取當前實測可用的版本；鎖定的精確版本見 requirements.txt。
dependencies = [
    "FinMind>=1.9",
    "fake-useragent>=2.2",
    "loguru>=0.7",
    "numpy>=2.4",
    "pandas>=3.0",
    "plotly>=6.7",
    "python-dateutil>=2.9",
    "python-dotenv>=1.2",
    "requests>=2.33",
    "shioaji>=1.3",
    "yfinance>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-timeout>=2.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# 以下三組刻意不放進主 dependencies：它們在目前的開發環境**並未安裝**，
# 而專案的回測與 ETL 主流程照樣可運作，硬列進去只會讓 `pip install -e .` 變重
frontend = ["streamlit>=1.40"]  # frontend/ 的 Streamlit 介面
tick = ["dolphindb>=3.0"]  # Tick 級資料的 DolphinDB 儲存（loader 內為惰性 import）
lab = ["python-docx>=1.2"]  # strategy_lab/ 的報告輸出

[tool.setuptools.packages.find]
# `core.managers` 等目錄沒有 __init__.py，靠 PEP 420 namespace package 運作，
# 故 namespaces 必須為 true，否則 editable 安裝後 `core.managers.*` 會 import 不到
namespaces = true
include = ["core*", "tasks*", "tests*"]
exclude = [
    # 資料與產出目錄：會被 namespace 掃描當成套件，實際上不含任何 .py
    "core.database*",
    "core.logs*",
    "core.data*",
    "core.pipeline.downloads*",
    "core.backtest.results*",
    "tests.database*",
    "tests.downloads*",
    "tests.temp*",
]

[tool.ruff]
line-length = 88  # CLAUDE.md §2.10
target-version = "py312"
extend-exclude = [
    "core/pipeline/downloads",
    "core/backtest/results",
    "core/logs",
    "kuo_test.ipynb",
    # ruff 0.16 起會連 Markdown 內的 Python 程式碼區塊一起格式化。
    # 文件裡的範例常刻意對齊註解以利閱讀，被重排只會製造與本工作無關的 diff；
    # `CLAUDE.md` §2.5／§2.10 規範的對象是程式碼，不是文件
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "TRY"]

# ignore 清單的每一條都必須註明對應的 CLAUDE.md 章節或延後理由，
# 不要在沒有理由的情況下「順手」打開或關閉（完整說明見 docs/dev/code-quality.md）
ignore = [
    # --- 與 CLAUDE.md §2.4 型別註解規範直接衝突：專案明訂用 typing 的大寫寫法 ---
    "UP006",  # §2.4.3 List/Dict，不改 list[...]/dict[...]
    "UP035",  # 同上，不移除 typing import
    "UP007",  # §2.4.3 Union[X, Y]，不改 X | Y
    "UP045",  # §2.4.4 Optional[T]，不改 T | None（391 處，數量最大的一條）

    # --- 與 CLAUDE.md §2.7 常數與 Enum 規範衝突 ---
    "UP042",  # §2.7 明訂 class XxxEnum(str, Enum)，不改 StrEnum

    # --- 行寬交給 formatter ---
    # formatter 已強制 line-length 88，但無法拆分註解、docstring 與長字串，
    # 而本專案的中文註解與結構化 docstring 必然有超長行（597 處）。
    # 留著只會讓 CI 永遠紅燈，且逼人把中文註解硬折行，可讀性反而更差
    "E501",

    # --- 例外處理：只量化不修，實測數字見 docs/dev/code-quality.md〈例外處理現況〉---
    # 數量過大會讓 CI 永遠紅燈，故先 ignore 並逐條記錄；
    # 不可因為「讓 CI 變綠」就當成永久豁免
    "BLE001",  # blind-except，85 處
    "TRY003",  # 例外訊息長度，與 §2.1 中文訊息衝突
    "TRY300",  # try-consider-else，19 處
    "TRY301",  # raise-within-try，3 處
    "TRY201",  # verbose-raise，3 處
    "TRY004",  # type-check-without-type-error，4 處

    # --- 設計選擇，非缺陷 ---
    # 基底類別刻意留的 no-op 掛點（例如股票的 settle_daily：股票沒有每日結算），
    # 標成 @abstractmethod 反而會強迫每個子類別寫一個空實作
    "B027",
    # zip(..., strict=) 屬行為決策：現有呼叫點多半長度本就相同，
    # 補 strict=True 可能讓原本靜默的長度不一致改為拋錯，須逐點確認後再開
    "B905",

    # --- 潛在缺陷，已逐點記錄，待後續收斂 ---
    # 這 21 處**不是樣式問題，是真的可能出錯的地方**，完整清單（含 file:line）記在
    # docs/dev/code-quality.md〈待收斂清單〉。之所以先 ignore 而非在原地加 noqa：
    # 加了 noqa 會讓該行超過 88 字元，formatter 就把運算式拆成多行，
    # noqa 反而跟著跑到別行去、失去效力（實測過）。
    # **修掉之後要把對應那條從本清單移除**，不要讓它長期留著。
    "B006",  # 可變預設參數，4 處
    "B008",  # 預設參數呼叫 datetime.date.today()，5 處（長駐程序會拿到匯入當下的日期）
    "B904",  # raise 未帶 from，3 處
    "B007",  # 未使用的迴圈變數，2 處
    "E722",  # 裸 except，3 處
    "F841",  # 指派後未使用，3 處
    "F811",  # 重複定義，1 處
]

[tool.ruff.lint.per-file-ignores]
# 套件的 re-export 門面：__init__.py 的 import 就是對外介面，不是未使用
"__init__.py" = ["F401"]

# 獨立執行的腳本：import 之前有 sys.path 設定或條件式 mock，E402 屬預期行為
"tests/*" = ["E402"]
"strategy_lab/*" = ["E402"]

# dolphindb 是選用相依（見 [project.optional-dependencies] 的 tick），
# 這幾處的 import 是「可用性探測」，不是沒用到的 import
"core/pipeline/utils/stock_tick_utils.py" = ["F401"]
"core/pipeline/loaders/stock_tick_loader.py" = ["F401"]
"tests/test_tick_updater.py" = ["F401"]


[tool.ruff.format]
quote-style = "double"  # CLAUDE.md §2.10

[tool.pytest.ini_options]
# 由 pytest.ini 併入（該檔已刪除）
markers = [
    "slow: 需要資料庫或耗時較久的測試（例如 LONG 回歸比對）",
]

[tool.coverage.run]
source = ["core"]
omit = [
    "*/__pycache__/*",
    "core/pipeline/downloads/*",
    "core/backtest/results/*",
    "core/logs/*",
]

[tool.coverage.report]
# 只建立基線，**不設 fail_under**：覆蓋率明顯偏低時設門檻只會鼓勵寫無效測試
# （見 docs/dev/code-quality.md〈測試覆蓋率基線〉）
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
