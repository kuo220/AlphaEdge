# 在本機就維持與 CI 相同的格式與 lint 標準，不必等 push 後才發現。
#
# 啟用方式（只需做一次）：
#     pip install pre-commit
#     pre-commit install
#
# 手動全專案執行：
#     pre-commit run --all-files
#
# 規則設定一律讀 pyproject.toml 的 [tool.ruff]，此處不重複定義，
# 避免本機與 CI 兩套設定漂移。

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3  # 與開發環境實測版本一致；升版時一併更新 pyproject 的 ruff>=
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # tick.png 有 512KB，雖已被 .gitignore 排除，但此掛鉤能防止類似檔案再進來
      - id: check-added-large-files
        args: [--maxkb=256]
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      # loguru 不吃標準庫的 exc_info=，會把它當 str.format() 的參數默默丟掉，
      # traceback 從來不會被印出來（健檢 F-080，全專案曾有 15 處）。
      # CI 端的等價護欄是 tests/test_entrypoint_and_logging.py 的 AST 掃描，
      # 這條只是讓錯誤寫法在 commit 當下就被擋掉，不必等跑完測試。
      - id: no-stdlib-exc-info
        name: 禁用 exc_info=（loguru 請用 logger.opt(exception=True)）
        entry: exc_info=
        language: pygrep
        files: ^(core|tasks)/.*\.py$

      # 分層相依閘門（反向 import、循環 import、市場語意洩漏、跨軸目錄污染）。
      # 這支腳本原本永遠 exit 1（strategy_lab 的循環 import 把整個閘門鎖住），
      # 2026-09-04 解掉之後才有資格當閘門（健檢 F-006）。約 0.5 秒，掃全專案，
      # 故 `pass_filenames: false` ＋ `always_run: true`——它看的是「邊」不是單檔
      - id: check-layer-deps
        name: 分層相依檢查（scripts/check_layer_deps.py）
        entry: python3 scripts/check_layer_deps.py
        language: system
        pass_filenames: false
        always_run: true
